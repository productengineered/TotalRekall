name: TotalRekall
options:
  bundleIdPrefix: com.productengineered
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "1630"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  TotalRekall:
    type: application
    platform: macOS
    sources:
      - path: TotalRekall
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: TotalRekall/TotalRekall.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # DEVELOPMENT_TEAM comes from the untracked app/Config/Local.xcconfig (see Local.xcconfig.example)
        # or the DEVELOPMENT_TEAM env var (scripts/install.sh passes it through). Intentionally not set here.
        # Unsandboxed: entitlements file intentionally has no com.apple.security.app-sandbox.
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.productengineered.TotalRekall
        SWIFT_EMIT_LOC_STRINGS: true
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          # Hardened runtime on, and no injected get-task-allow: the app holds Accessibility.
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
  TotalRekallTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TotalRekallTests
    dependencies:
      - target: TotalRekall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TotalRekall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TotalRekall"
  TotalRekallUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TotalRekallUITests
    dependencies:
      - target: TotalRekall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TotalRekall
schemes:
  TotalRekall:
    build:
      targets:
        TotalRekall: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TotalRekallTests
        - TotalRekallUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
